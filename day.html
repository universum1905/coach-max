<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Max – Day 1</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Drehhinweis für Hochformat-Nutzung -->
  <div id="orientationOverlay">
    <img src="images/landscape-mode-child-cartoon.png" alt="Rotate Device" />
    <div class="rotate-icon">🔄</div>
    <p class="rotate-text">Please rotate your device</p>
    <p class="rotate-sub">So you can enjoy the activity in full screen 😊</p>
  </div>

  <h1 id="day-title">🎯 Day 1 – Let's Begin!</h1>

  <div id="session-container">
    <!-- Hier erscheint Text & Video automatisch -->
  </div>

  <!-- Avatar-Video in der Ecke -->
  <img id="avatar-video" class="avatar-video" src="" alt="Avatar" />

  <!-- Fortschrittsanzeige mit springendem Tier -->
  <div id="progress-bar">
    <div class="progress-step">🐸</div>
    <div class="progress-step">🐸</div>
    <div class="progress-step">🐸</div>
    <div class="progress-step">🐸</div>
    <div class="progress-step">🐸</div>
    <div class="progress-step">🐸</div>
  </div>

  <!-- Weiter-Button -->
  <button onclick="nextSession()">Next ➡️</button>

  <!-- Belohnung -->
  <div id="reward-popup" style="display:none">
    <h2>🎉 Sticker Unlocked!</h2>
    <img id="sticker-img" src="" alt="Sticker" />
  </div>

  <!-- Soundeffekte -->
  <audio id="yay-sound" src="audio/yay.mp3"></audio>
  <audio id="fail-sound" src="audio/fail.mp3"></audio>

  <!-- Haupt-JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
