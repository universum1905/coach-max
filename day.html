<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Max – Dynamic Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: url('images/backgrounds/2.png') repeat;
      background-size: cover;
    }
    .effect-popup {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      background: white;
      padding: 1rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 50;
      animation: pop-fade 1.5s ease-out forwards;
    }
    .fixed-video {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 160px;
      height: 100px;
      z-index: 40;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    @keyframes pop-fade {
      0% { opacity: 0; transform: translate(-50%, -20%) scale(0.8); }
      10% { opacity: 1; transform: translate(-50%, 0%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, 0%) scale(1); }
    }
  </style>
</head>
<body class="text-black min-h-screen flex flex-col items-center justify-start p-4">
  <main id="content" class="w-full max-w-xl space-y-6"></main>
  <audio id="successSound" src="audio/success.mp3" preload="auto"></audio>
  <video id="sessionVideo" class="fixed-video hidden" muted playsinline></video>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const day = urlParams.get('day') || '1';

    let activeVideo = document.getElementById('sessionVideo');
    let currentSessionEffects = [];

    fetch(`days/day${day}.json`)
      .then(res => res.json())
      .then(data => renderDay(data));

    function renderDay(data) {
      const container = document.getElementById("content");
      data.sessions.forEach((session, index) => {
        const div = document.createElement("div");
        div.className = "bg-white bg-opacity-80 rounded-xl p-4 shadow text-center";
        div.innerHTML = `
          <h2 class="text-2xl font-bold mb-2">${session.title}</h2>
          <p class="text-lg mb-4">${session.text}</p>
        `;

        if (session.video) {
          div.dataset.video = session.video;
          div.dataset.effects = JSON.stringify(session.effects || []);
        }

        if (session.type === 'counting') {
          const area = document.createElement("div");
          area.className = "flex flex-wrap justify-center gap-4 mt-4";
          session.animals.forEach((a, i) => {
            setTimeout(() => {
              const wrap = document.createElement("div");
              wrap.className = "flex flex-col items-center gap-1";
              wrap.innerHTML = `
                <div class="bg-yellow-300 text-xl text-white rounded-full w-14 h-14 flex items-center justify-center shadow">${a.number}</div>
                <img src="${a.img}" alt="${a.name}" class="w-20 h-20 object-contain" />
              `;
              area.appendChild(wrap);
            }, i * 800);
          });
          div.appendChild(area);
        }

        if (index < data.sessions.length - 1) {
          const btn = document.createElement("button");
          btn.className = "mt-6 bg-blue-500 text-white px-6 py-2 rounded-full";
          btn.textContent = "Next ➡️";
          btn.disabled = true;
          btn.onclick = () => {
            stopVideo();
            div.classList.add("hidden");
            div.nextElementSibling.classList.remove("hidden");
            startSession(div.nextElementSibling);
          };
          div.appendChild(btn);
        } else {
          const btn = document.createElement("button");
          btn.className = "mt-6 bg-green-500 text-white px-6 py-2 rounded-full";
          btn.textContent = "✅ Finish Day";
          btn.disabled = true;
          btn.onclick = () => {
            stopVideo();
            showFinish();
          };
          div.appendChild(btn);
        }

        div.classList.toggle("hidden", index !== 0);
        container.appendChild(div);
      });

      // Start first session
      const first = container.children[0];
      startSession(first);
    }

    function startSession(sessionDiv) {
      const videoSrc = sessionDiv.dataset.video;
      const effects = JSON.parse(sessionDiv.dataset.effects || '[]');

      if (videoSrc) {
        activeVideo.src = videoSrc;
        activeVideo.classList.remove("hidden");
        activeVideo.currentTime = 0;
        activeVideo.play();
        currentSessionEffects = effects;

        currentSessionEffects.forEach(e => e.triggered = false);

        activeVideo.ontimeupdate = () => {
          currentSessionEffects.forEach(effect => {
            if (!effect.triggered && activeVideo.currentTime >= effect.time) {
              showEffect(effect);
              effect.triggered = true;
            }
          });
        };

        activeVideo.onended = () => {
          const btn = sessionDiv.querySelector("button");
          if (btn) btn.disabled = false;
        };
      } else {
        const btn = sessionDiv.querySelector("button");
        if (btn) btn.disabled = false;
      }
    }

    function stopVideo() {
      activeVideo.pause();
      activeVideo.src = "";
      activeVideo.classList.add("hidden");
      activeVideo.ontimeupdate = null;
    }

    function showEffect(effect) {
      const popup = document.createElement('div');
      popup.className = 'effect-popup';
      popup.textContent = `${effect.emoji || ''} ${effect.text || ''}`;
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 1600);
    }

    function showFinish() {
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="text-center space-y-4 mt-10">
          <h2 class="text-3xl font-bold text-green-700">✅ Great job today!</h2>
          <lottie-player
            src="animation/hai-animation.json"
            background="transparent"
            speed="1"
            style="width: 160px; height: 160px; margin: auto;"
            autoplay loop>
          </lottie-player>
          <p class="text-xl">Come back tomorrow at 6:00 AM to unlock Day ${parseInt(day) + 1} 🌞</p>
          <div class="flex justify-center gap-4">
            <a href="stickers.html" class="bg-yellow-500 text-black px-4 py-2 rounded-full">🏅 See Stickers</a>
            <a href="index.html" class="bg-gray-700 text-white px-4 py-2 rounded-full">🏠 Back Home</a>
            <a href="choose.html" class="bg-blue-600 text-white px-6 py-2 rounded-full">➡️ Choose another day</a>
          </div>
        </div>
      `;
      const now = new Date();
      const unlock = new Date(now);
      unlock.setDate(now.getDate() + 1);
      unlock.setHours(6, 0, 0, 0);
      localStorage.setItem(`day${parseInt(day) + 1}UnlockTime`, unlock.getTime());
      localStorage.setItem(`day${day}Completed`, 'true');
      sessionStorage.setItem('dayUnlockedMessage', 'true');
      sessionStorage.setItem('stickerUnlocked', 'true');
      const sound = document.getElementById("successSound");
      if (sound) sound.play().catch(() => {});
    }
  </script>
</body>
</html>
