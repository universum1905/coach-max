<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coach Max – Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Baloo 2', cursive;
      background: url('images/backgrounds/2.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
    }

    .page-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem 100px 1rem;
      box-sizing: border-box;
    }

    .text-line {
      font-size: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 25px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      max-width: calc(100% - 180px);
      opacity: 0;
      transform: translateX(-50px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .text-line.show {
      animation: slideIn 0.8s ease forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .text-line.show::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.9), transparent);
      background-size: 200% 100%;
      animation: shine 2.2s linear;
      z-index: 0;
    }

    @keyframes shine {
      from { background-position: -200% 0; }
      to   { background-position: 200% 0; }
    }

    .text-line.pulse {
      animation: slideIn 0.8s ease forwards, pulse 1.5s infinite ease-in-out;
      background-color: #fff0d6;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 200, 100, 0.4); }
      50% { transform: scale(1.07); box-shadow: 0 0 25px rgba(255, 180, 0, 0.6); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 200, 100, 0.4); }
    }

    .media-image {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: auto;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 2;
    }

    .visible {
      opacity: 1 !important;
    }

    .video-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 160px !important;
      max-width: 160px;
      z-index: 999;
    }

    .video-box video {
      width: 100% !important;
      height: auto !important;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      display: block;
    }

    #nextBtn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 30px;
      font-size: 22px;
      background: linear-gradient(135deg, #ffcb05, #ff6f61);
      color: #222;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      display: none;
      z-index: 1000;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -10px); }
    }
  </style>
</head>
<body>
  <div class="page-container" id="main"></div>
  <img id="mediaImage" class="media-image" src="">

  <div class="video-box">
    <video id="videoBox" controls muted playsinline></video>
  </div>

  <button id="nextBtn" onclick="nextSession()">👶 Start next Session</button>

  <script>
    let sessionIndex = 0;
    let sessionData = [];

    async function loadDayJson() {
      const res = await fetch("days/day1.json");
      const json = await res.json();
      sessionData = json.sessions;
      startSession(sessionIndex);
    }

    function startSession(index) {
      const container = document.getElementById("main");
      const video = document.getElementById("videoBox");
      const imageEl = document.getElementById("mediaImage");
      const btn = document.getElementById("nextBtn");

      container.innerHTML = "";
      imageEl.src = "";
      imageEl.classList.remove("visible");
      btn.style.display = "none";

      video.pause();
      video.removeAttribute("src");
      video.load();

      const session = sessionData[index];
      if (!session) return;

      video.src = session.video;
      video.load();

      if (session.type === "intro" || session.type === "story") {
        const lines = session.texts;
        const interval = 60000 / lines.length;
        lines.forEach((lineObj, i) => {
          const line = document.createElement("div");
          line.className = "text-line";
          line.innerText = lineObj.text;
          setTimeout(() => {
            container.appendChild(line);
            line.classList.add("show");
            if (i === lines.length - 1) line.classList.add("pulse");
            line.scrollIntoView({ behavior: "smooth", block: "center" });
          }, interval * i);
        });
      } else if (session.type === "breathing") {
        let i = 0;
        const total = session.texts.length;
        const cycle = () => {
          if (i >= total) return;
          const text = session.texts[i];
          const img = session.images[i % session.images.length];

          const line = document.createElement("div");
          line.className = "text-line";
          line.innerText = text;

          container.innerHTML = "";
          container.appendChild(line);
          line.classList.add("show");

          imageEl.src = img;
          imageEl.classList.add("visible");

          setTimeout(() => {
            line.classList.remove("show");
            imageEl.classList.remove("visible");
          }, 3000);

          i++;
          setTimeout(cycle, 4000);
        };
        cycle();

        setTimeout(() => {
          btn.style.display = "block";
        }, session.duration * 1000);
      }
    }

    function nextSession() {
      const video = document.getElementById("videoBox");
      video.play();
      sessionIndex++;
      startSession(sessionIndex);
    }

    loadDayJson();
  </script>
</body>
</html>
