<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Stickerboard 🏆</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #fce4ec);
      padding: 2rem;
      min-height: 100vh;
      text-align: center;
    }
    .sticker {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }
    .sticker:hover {
      transform: scale(1.1);
    }
    .locked {
      background-color: #e5e7eb;
      color: #9ca3af;
    }
    .unlocked {
      background-color: #fff176;
      color: #374151;
    }
  </style>
</head>
<body>

  <h1 class="text-3xl font-bold mb-6">🏆 Your Sticker Collection</h1>
  <p class="text-lg mb-8 text-gray-600">Come back every day to earn a new sticker!</p>

<!-- Fortschrittsbalken -->
<div class="mb-10">
  <p class="text-lg mb-2 font-semibold text-gray-700">Progress</p>
  <div class="w-full bg-gray-300 rounded-full h-6 overflow-hidden shadow-inner">
    <div id="progressBar" class="bg-green-400 h-6 text-white text-sm text-center leading-6 transition-all duration-500 ease-in-out" style="width: 0%;">
      0%
    </div>
  </div>
</div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 justify-center max-w-2xl mx-auto">
    <div id="day1" class="sticker locked">1️⃣</div>
    <div id="day2" class="sticker locked">2️⃣</div>
    <div id="day3" class="sticker locked">3️⃣</div>
    <div id="day4" class="sticker locked">4️⃣</div>
    <div id="day5" class="sticker locked">5️⃣</div>
    <div id="day6" class="sticker locked">6️⃣</div>
    <div id="day7" class="sticker locked">7️⃣</div>
  </div>

  <div class="mt-10">
    <a href="choose.html" class="text-blue-600 underline text-lg">← Back to Choose Your Day</a>
  </div>

  <script>
  const days = [1, 2, 3, 4, 5, 6, 7];
  let completed = 0;

  days.forEach(day => {
    if (localStorage.getItem(`day${day}Completed`) === "true") {
      const el = document.getElementById(`day${day}`);
      el.classList.remove("locked");
      el.classList.add("unlocked");
      el.innerText = `🌟`;
      completed++;
    }
  });

  // Fortschrittsbalken aktualisieren
  const progress = Math.round((completed / days.length) * 100);
  const progressBar = document.getElementById("progressBar");
  progressBar.style.width = `${progress}%`;
  progressBar.textContent = `${progress}%`;
</script>

</body>
</html>
