<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Puzzle Board – Coach Max</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: #e8f6ff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .puzzle-board {
  margin: 4vw auto 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(56px, 1fr));
  gap: 3vw;
  max-width: 98vw;
  position: relative;
}
    .puzzle-shadow {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.20;
      z-index: 0;
    }
    .puzzle-piece.found {
      background: #fff9c4;
      color: #333;
      border: 2.5px solid #ffd54f;
      animation: bounceIn 0.6s;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5);}
      60% { transform: scale(1.25);}
      90% { transform: scale(0.93);}
      100% { transform: scale(1);}
    }
    .puzzle-piece.locked {
      opacity: 0.35;
      background: #eeeeee;
      border-style: dashed;
    }
	.puzzle-piece, .puzzle-piece img {
  width: 20vw;
  height: 20vw;
  max-width: 88px;
  max-height: 88px;
  min-width: 44px;
  min-height: 44px;
}
@media (max-width: 600px) {
  .puzzle-board {
    grid-template-columns: repeat(2, minmax(32vw, 1fr));
    gap: 4vw;
  }
  .puzzle-piece, .puzzle-piece img {
    width: 36vw;
    height: 36vw;
    max-width: 98px;
    max-height: 98px;
    min-width: 38px;
    min-height: 38px;
  }
}

  </style>
</head>
<body>
  <h1 class="text-3xl font-bold">🧩 Puzzle Board</h1>
  <p>Collect all pieces to complete the picture!</p>
  <div class="puzzle-board" id="puzzleBoard"></div>

  <div style="margin-top:38px;">
    <a href="choose.html" style="color:#1976d2; text-decoration:underline; font-weight:bold;">← Back to Days</a>
  </div>

  <script>
    const PUZZLE_ID = 1;
    const TOTAL_PIECES = 8;
    const puzzleImgPrefix = `images/puzzles/puzzle${PUZZLE_ID}_piece`; // z. B. images/puzzles/puzzle1_piece0.png
    const shadowImg = `images/puzzles/puzzle${PUZZLE_ID}_shadow.png`;

    const foundPieces = JSON.parse(localStorage.getItem(`puzzle${PUZZLE_ID}Pieces`) || "[]");
    const board = document.getElementById("puzzleBoard");

    // Schattenraster anzeigen
    const shadow = document.createElement("img");
    shadow.src = shadowImg;
    shadow.className = "puzzle-shadow";
    shadow.draggable = false;
    board.appendChild(shadow);

    // Puzzle-Stücke anzeigen
    for (let i = 0; i < TOTAL_PIECES; i++) {
      const div = document.createElement("div");
      div.className = "puzzle-piece";
      if (foundPieces.includes(i)) {
        div.classList.add("found");
        // Bildstück anzeigen
        const img = document.createElement("img");
        img.src = `${puzzleImgPrefix}${i}.png`;
        img.alt = `Piece ${i + 1}`;
        div.appendChild(img);
      } else {
        div.classList.add("locked");
        div.innerHTML = "❔";
      }
      board.appendChild(div);
    }

    // Kompletterfolg
    if (foundPieces.length === TOTAL_PIECES) {
      setTimeout(() => {
        alert("🎉 Puzzle Complete! Well done!");
        // Hier kannst du eine Animation, Glitzer oder Download-Möglichkeit einbauen
      }, 400);
    }
  </script>
</body>
</html>
