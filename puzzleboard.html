<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Puzzle Board – Coach Max</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: #e8f6ff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .puzzle-board {
      margin: 40px auto 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 72px); /* z.B. 4x2 Puzzle */
      gap: 12px;
      justify-content: center;
    }
    .puzzle-piece {
      width: 70px;
      height: 70px;
      background: #eee;
      border-radius: 18px;
      box-shadow: 0 2px 10px #b2ebf2cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      color: #bbb;
      transition: background 0.22s;
      border: 2.5px solid #90caf9;
    }
    .puzzle-piece.found {
      background: #fffbe6;
      color: #333;
      border: 2.5px solid #ffd54f;
    }
  </style>
</head>
<body>
  <h1 class="text-3xl font-bold">🧩 Puzzle Board</h1>
  <p>Collect all pieces to complete the picture!</p>
  <div class="puzzle-board" id="puzzleBoard"></div>

  <div style="margin-top:38px;">
    <a href="choose.html" style="color:#1976d2; text-decoration:underline; font-weight:bold;">← Back to Days</a>
  </div>

  <script>
    // --- Dummy-Logik: später ersetzen! ---
    // Angenommen: 8 Puzzleteile (Index 0–7)
    const TOTAL_PIECES = 8;
    // Hier lesen wir aus LocalStorage (bald dynamisch pro Puzzle!)
    const foundPieces = JSON.parse(localStorage.getItem("puzzle1Pieces") || "[]");
    const board = document.getElementById("puzzleBoard");

    for (let i = 0; i < TOTAL_PIECES; i++) {
      const div = document.createElement("div");
      div.className = "puzzle-piece" + (foundPieces.includes(i) ? " found" : "");
      div.textContent = foundPieces.includes(i) ? "🧩" : "❔";
      board.appendChild(div);
    }
  </script>
</body>
</html>
