<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Day – Coach Max</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: url('images/backgrounds/2.png') repeat;
      background-size: cover;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6 text-center">
  <h1 class="text-3xl font-bold mb-6">📅 Choose Your Day</h1>
  
  <div class="w-full max-w-md flex justify-end mb-4">
    <a href="stickerboard.html" class="bg-yellow-200 text-yellow-900 font-bold rounded-xl px-4 py-2 shadow hover:bg-yellow-300 transition mr-2">
      🏅 Sticker Board
    </a>
	<a href="puzzleboard.html" class="bg-blue-100 text-blue-900 font-bold rounded-xl px-4 py-2 shadow hover:bg-blue-200 transition">
  🧩 Puzzle Board
</a>
<a href="gallery.html" class="bg-pink-200 text-pink-900 font-bold rounded-xl px-4 py-2 shadow hover:bg-pink-300 transition mb-4">
  🎨 My Gallery
</a>

  </div>
  
  <p class="text-gray-600 mb-2">Tap a day to start your adventure. New days unlock every morning at 6:00 AM!</p>
  <div id="dayList" class="flex flex-wrap justify-center gap-4 w-full max-w-md"></div>
  <div id="unlockOverlay" style="display:none; position:fixed; z-index:50; inset:0; background:rgba(0,0,0,0.65); align-items:center; justify-content:center;">
  <div id="unlockModal" class="rounded-3xl bg-white p-8 max-w-xs mx-auto flex flex-col items-center text-center shadow-xl animate-bounce-in">
    <div id="unlockModalIcon" class="text-6xl mb-2 animate-shine">🔒</div>
    <div id="unlockModalMsg" class="font-bold text-lg mb-2">Please come back tomorrow!</div>
    <button id="unlockOverlayBtn" class="mt-4 bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold shadow-lg text-lg">OK</button>
  </div>
</div>
  <script>
const totalDays = 100;
const dayList = document.getElementById("dayList");

function isPremiumUser() {
  return localStorage.getItem("isPremiumUser") === "true";
}

function isDayUnlocked(dayNumber) {
  if (dayNumber === 1) return true;
  const prevCompleted = localStorage.getItem(`day${dayNumber - 1}Completed`);
  const unlockTime = localStorage.getItem(`day${dayNumber}UnlockTime`);
  const now = Date.now();
  if (dayNumber > 7 && !isPremiumUser()) return false;
  if (!prevCompleted) return false;
  if (unlockTime && now < +unlockTime) return false;
  return true;
}

function showUnlockOverlay(msg, emoji = "🔒", showPaywall = false) {
  document.getElementById("unlockOverlay").style.display = "flex";
  document.getElementById("unlockModalIcon").innerText = emoji;
  document.getElementById("unlockModalMsg").innerHTML = msg;
  const btn = document.getElementById("unlockOverlayBtn");
  btn.innerText = showPaywall ? "Go Premium" : "OK";
  btn.onclick = function() {
    document.getElementById("unlockOverlay").style.display = "none";
    if (showPaywall) showPaywallModal();
  };
}

function showPaywallModal() {
  showUnlockOverlay(`
    <div class="text-pink-500 text-2xl mb-2">✨ Coach Max Premium ✨</div>
    <div class="mb-3">Unlock all days for <b>just $9.99/month</b>!</div>
    <img src="images/stickers/star.png" alt="Star" class="w-16 mx-auto mb-2 animate-bounce">
    <div class="text-base mb-2">
      Exclusive stickers & new adventures every day!<br>Cancel anytime.
    </div>
    <button onclick="window.open('https://coach-max.lemonsqueezy.com/buy/600fbb48-8189-41ea-adbd-32a3eed96cca', '_blank')" class="bg-pink-500 text-white mt-4 px-6 py-3 rounded-full text-lg font-bold shadow animate-bounce">Go Premium</button>
    <div style="margin-top:18px; font-size:1em;">
      Questions? <a href="parents.html" style="color:#1976d2; text-decoration:underline; font-weight:700;">See our FAQ for Parents</a>
    </div>
  `, "⭐", false);
}


function unlockPremium() {
  localStorage.setItem("isPremiumUser", "true");
  location.reload();
}
function removePremium() {
  localStorage.removeItem("isPremiumUser");
  location.reload();
}

// --- Tag Buttons erzeugen ---
for (let i = 1; i <= totalDays; i++) {
  const unlockTime = localStorage.getItem(`day${i}UnlockTime`);
  const isUnlocked = isDayUnlocked(i);
  const isCompleted = localStorage.getItem(`day${i}Completed`) === 'true';

  const btn = document.createElement('button');
  btn.className = `rounded-2xl px-6 py-4 font-bold text-xl flex items-center justify-center shadow transition duration-300 ${
    isUnlocked
      ? isCompleted
        ? 'bg-green-400 text-white hover:bg-green-500'
        : 'bg-blue-400 text-white hover:bg-blue-500'
      : 'bg-gray-300 text-gray-500 cursor-not-allowed'
  }`;
  btn.textContent = `Day ${i}`;

  if (isUnlocked) {
    btn.onclick = () => location.href = `day.html?day=${i}`;
    btn.classList.add("animate-pulse");
  } else {
    btn.onclick = (e) => {
      e.preventDefault();
      if (i > 7 && !isPremiumUser()) {
        showUnlockOverlay("This day is only available with Premium!<br><span class='text-pink-500 font-bold'>Unlock all adventures for $9.99/month.</span>", "💎", true);
      } else {
        const unlockTime = localStorage.getItem(`day${i}UnlockTime`);
        let timeMsg = "";
        if (unlockTime) {
          const dt = new Date(+unlockTime);
          timeMsg = `<br><b>Next day unlocks at ${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</b>`;
        }
        showUnlockOverlay("Please come back tomorrow!" + timeMsg, "⏳");
      }
    };
  }
  dayList.appendChild(btn);
}

// --- New Day Unlocked Popup (dein bisheriger Code bleibt) ---
if (sessionStorage.getItem('dayUnlockedMessage') === 'true') {
  const popup = document.createElement('div');
  popup.textContent = '🎉 New Day Unlocked!';
  popup.className = 'fixed top-8 left-1/2 transform -translate-x-1/2 bg-yellow-300 text-black px-4 py-2 rounded-xl shadow-xl z-50 animate-bounce';
  document.body.appendChild(popup);
  setTimeout(() => {
    popup.remove();
    sessionStorage.removeItem('dayUnlockedMessage');
  }, 3000);
}
</script>

  <div class="fixed bottom-2 right-2 z-50">
  <button onclick="unlockPremium()" class="bg-yellow-400 hover:bg-yellow-500 rounded-full px-4 py-2 font-bold shadow">DEV: Unlock Premium</button>
  <button onclick="removePremium()" class="bg-gray-300 hover:bg-gray-400 rounded-full px-4 py-2 font-bold shadow ml-2">DEV: Lock Premium</button>
</div>

<div class="w-full flex justify-center mb-5">
  <a href="index.html" class="bg-yellow-300 hover:bg-yellow-400 text-blue-900 font-bold px-6 py-2 rounded-xl shadow transition">
    ← 🏠 Back to Welcome Page
  </a>
</div>
<!-- FAQ Parent Notice (nur auf dieser Seite sichtbar, fixiert unten links) -->
<div id="faqParentNotice" style="position:fixed;bottom:24px;left:24px;z-index:1110;
  font-size:1.06rem;background:#fffbe6;padding:10px 24px;border-radius:13px;
  box-shadow:0 4px 18px #ffd54faa;letter-spacing:0.02em;color:#006aa8;">
  Questions? 
  <a href="parents.html" style="text-decoration:underline;color:#0096d6;">See our FAQ for Parents</a>
</div>
</body>
</html>
