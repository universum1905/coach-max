<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(to bottom right, #fef3c7, #d1fae5);
    }
    .card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 1rem;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold text-center mb-4">📚 Choose Your Day</h1>

<div class="mb-4 w-full max-w-3xl flex justify-end">
  <button onclick="window.location.href='stickers.html'" class="bg-yellow-400 text-black font-semibold px-4 py-2 rounded-full shadow hover:bg-yellow-300 transition">
    🏆 View Stickers
  </button>
</div>

  <!-- Admin Toggle -->
  <div class="mb-4">
    <button id="toggleDevMode" class="text-sm px-3 py-1 rounded-full bg-purple-500 text-white shadow">Toggle Admin Mode</button>
<div class="mb-4">
  <button id="resetStorage" class="text-sm px-3 py-1 rounded-full bg-red-500 text-white shadow">Reset Progress</button>
  <span class="ml-2 text-sm text-gray-600">(Deletes all local progress)</span>
</div>
    <span id="devModeStatus" class="ml-2 text-sm text-gray-600"></span>
  </div>

  <div id="progressInfo" class="text-lg font-medium text-gray-700 mb-4"></div>
  <div id="progressBar" class="w-full max-w-3xl h-4 bg-gray-300 rounded-full overflow-hidden mb-6">
    <div id="progressFill" class="h-full bg-green-500 transition-all duration-300"></div>
  </div>
  <div id="daysContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full max-w-3xl"></div>

  <script>
  // DEV_MODE zentral speichern und abrufen
  const devModeStorage = localStorage.getItem('devMode');
  let DEV_MODE = devModeStorage === 'true';

  // Toggle Button Funktionalität
  document.getElementById("toggleDevMode").addEventListener("click", () => {
    DEV_MODE = !DEV_MODE;
    localStorage.setItem("devMode", DEV_MODE.toString());
    location.reload();
  });

  document.getElementById("devModeStatus").textContent = DEV_MODE ? "(DEV Mode active)" : "(Live Mode active)";

  const maxDays = 30;
  const container = document.getElementById('daysContainer');
  const progressFill = document.getElementById('progressFill');
  const progressInfo = document.getElementById('progressInfo');

  let completedCount = 0;

  for (let day = 1; day <= maxDays; day++) {
    const completed = localStorage.getItem(`day${day}Completed`) === 'true';
    const unlockTime = localStorage.getItem(`day${day}UnlockTime`);
    let isUnlocked = false;

    if (DEV_MODE) {
      isUnlocked = true;
      localStorage.removeItem(`day${day}UnlockTime`);
    } else {
      isUnlocked = !unlockTime || Date.now() >= parseInt(unlockTime);
    }

    if (completed || isUnlocked) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="text-4xl mb-2">🎯</div>
        <h2 class="text-xl font-bold">Day ${day}</h2>
        <button onclick="window.location.href='day${day}.html'" class="mt-2 bg-green-500 text-white px-4 py-2 rounded-full">Start</button>
      `;
      container.appendChild(card);
    }

    if (completed) completedCount++;
  }

  const percent = (completedCount / maxDays) * 100;
  progressFill.style.width = `${percent}%`;
  progressInfo.textContent = `✅ ${completedCount} / ${maxDays} Days Completed`;
</script>


</body>
</html>
