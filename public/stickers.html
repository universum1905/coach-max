<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏅 My Stickers – Coach Max</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: url('images/backgrounds/2.png') repeat;
      background-size: cover;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6 text-center">
  <h1 class="text-3xl font-bold mb-4">🏅 My Stickers</h1>
  <p class="mb-6">You earn a sticker for every finished day!</p>
  <div id="sticker-grid" class="grid grid-cols-3 gap-4 w-full max-w-md"></div>

  <script>
    const TOTAL_DAYS = 100;
    const grid = document.getElementById('sticker-grid');

    for (let i = 1; i <= TOTAL_DAYS; i++) {
      const completed = localStorage.getItem(`day${i}Completed`) === 'true';
      const sticker = document.createElement('div');
      sticker.className = `rounded-xl p-4 shadow flex flex-col items-center justify-center h-28 ${completed ? 'bg-yellow-300 text-black' : 'bg-gray-200 text-gray-400'}`;
      sticker.innerHTML = completed
        ? `<div class="text-4xl mb-2">🏅</div><span class="font-bold">Day ${i}</span>`
        : `<div class="text-2xl mb-2">❌</div><span>Day ${i}</span>`;
      grid.appendChild(sticker);
    }
  </script>
</body>
</html>
