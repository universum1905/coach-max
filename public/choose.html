<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Day – Coach Max</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: url('images/backgrounds/2.png') repeat;
      background-size: cover;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-6 text-center">
  <h1 class="text-3xl font-bold mb-6">📅 Choose Your Day</h1>

  <div class="p-4 bg-white/80 rounded-xl shadow mb-4 max-w-md w-full">
    <h2 class="text-xl font-bold mb-2">Active Profile: <span id="activeChildName"></span></h2>
    <button id="switchProfileBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Switch Profile</button>
  </div>
  
  <div class="w-full max-w-md flex justify-end mb-4">
    <a href="stickerboard.html" class="bg-yellow-200 text-yellow-900 font-bold rounded-xl px-4 py-2 shadow hover:bg-yellow-300 transition mr-2">🏅 Sticker Board</a>
    <a href="puzzleboard.html" class="bg-blue-100 text-blue-900 font-bold rounded-xl px-4 py-2 shadow hover:bg-blue-200 transition">🧩 Puzzle Board</a>
    <a href="gallery.html" class="bg-pink-200 text-pink-900 font-bold rounded-xl px-4 py-2 shadow hover:bg-pink-300 transition mb-4">🎨 My Gallery</a>
  </div>
  
  <p class="text-gray-600 mb-2">Tap a day to start your adventure. New days unlock every morning at 6:00 AM!</p>
  <div id="dayList" class="flex flex-wrap justify-center gap-4 w-full max-w-md"></div>

  <div id="unlockOverlay" style="display:none; position:fixed; z-index:50; inset:0; background:rgba(0,0,0,0.65); align-items:center; justify-content:center;">
    <div id="unlockModal" class="rounded-3xl bg-white p-8 max-w-xs mx-auto flex flex-col items-center text-center shadow-xl animate-bounce-in">
      <div id="unlockModalIcon" class="text-6xl mb-2 animate-shine">🔒</div>
      <div id="unlockModalMsg" class="font-bold text-lg mb-2">Please come back tomorrow!</div>
      <button id="unlockOverlayBtn" class="mt-4 bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold shadow-lg text-lg">OK</button>
    </div>
  </div>

  <script type="module">
  import { DEV_MODE } from "/js/config.js";
  import { auth, db, onAuthStateChanged, doc, getDoc, getDocs, collection } from "/js/firebase.js";

  const totalDays = 100;
  const dayList = document.getElementById("dayList");
  const activeChildId = localStorage.getItem("activeChildId");
  const activeChildNameEl = document.getElementById("activeChildName");
  let user = null;
  let completedDays = [];
  let isPremium = false;

  if (!DEV_MODE) {
    onAuthStateChanged(auth, async (u) => {
      if (!u) return window.location.href = "index.html";
      user = u;
      await loadChildData();
      renderDays();
    });
  } else {
    activeChildNameEl.textContent = "Test Child";
    renderDays();
  }

  async function loadChildData() {
    const childRef = doc(db, "users", user.uid, "children", activeChildId);
    const childSnap = await getDoc(childRef);
    if (!childSnap.exists()) {
      alert("Profile not found.");
      window.location.href = "index.html";
    }
    const data = childSnap.data();
    activeChildNameEl.textContent = data.name;
    completedDays = data.completedDays || [];
    const userDoc = await getDoc(doc(db, "users", user.uid));
    isPremium = userDoc.exists() && (userDoc.data().subscriptionStatus === "premium" || Date.now() < userDoc.data().trialEnds);
  }

  function isDayUnlocked(dayNumber) {
    if (DEV_MODE) return true;
    if (dayNumber === 1) return true;
    if (dayNumber > 7 && !isPremium) return false;
    const prevCompleted = completedDays.includes(dayNumber - 1);
    return prevCompleted;
  }

  function renderDays() {
    dayList.innerHTML = "";
    for (let i = 1; i <= totalDays; i++) {
      const isUnlocked = isDayUnlocked(i);
      const isCompleted = completedDays.includes(i);

      const btn = document.createElement('button');
      btn.className = `rounded-2xl px-6 py-4 font-bold text-xl flex items-center justify-center shadow transition duration-300 ${
        isUnlocked
          ? isCompleted
            ? 'bg-green-400 text-white hover:bg-green-500'
            : 'bg-blue-400 text-white hover:bg-blue-500'
          : 'bg-gray-300 text-gray-500 cursor-not-allowed'
      }`;
      btn.textContent = `Day ${i}`;

      btn.onclick = () => {
        if (isUnlocked) {
          window.location.href = `day.html?day=${i}`;
        } else {
          alert("This day is locked!");
        }
      };
      dayList.appendChild(btn);
    }
  }
</script>

  <div class="w-full flex justify-center mb-5">
    <a href="index.html" class="bg-yellow-300 hover:bg-yellow-400 text-blue-900 font-bold px-6 py-2 rounded-xl shadow transition">
      ← 🏠 Back to Welcome Page
    </a>
  </div>

  <div id="faqParentNotice" style="position:fixed;bottom:24px;left:24px;z-index:1110;
    font-size:1.06rem;background:#fffbe6;padding:10px 24px;border-radius:13px;
    box-shadow:0 4px 18px #ffd54faa;letter-spacing:0.02em;color:#006aa8;">
    Questions? 
    <a href="parents.html" style="text-decoration:underline;color:#0096d6;">See our FAQ for Parents</a>
  </div>
</body>
</html>
