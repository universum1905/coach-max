<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sticker Board</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #fffbe6 0%, #e6f9ff 90%);
      min-height: 100vh;
      font-family: 'Comic Neue', 'Baloo 2', Arial, sans-serif;
    }
    .sticker-board-container {
      max-width: 600px;
      margin: 38px auto;
      background: #fffde7cc;
      border-radius: 26px;
      box-shadow: 0 8px 48px #ffd54f2c, 0 2px 8px #b3e5fc88;
      padding: 32px 10px 36px 10px;
    }
    h1 {
      text-align: center;
      color: #ffb300;
      margin-bottom: 16px;
      font-size: 2.1rem;
      letter-spacing: 0.04em;
      font-family: 'Baloo 2', 'Comic Neue', Arial, sans-serif;
    }
    .sticker-board {
      display: flex;
      flex-wrap: wrap;
      gap: 30px 22px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 22px;
    }
    .sticker-card {
      width: 98px;
      height: 118px;
      background: #fffbe6;
      border-radius: 20px;
      box-shadow: 0 4px 20px #ffe0822a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      padding-bottom: 16px;
      transition: box-shadow 0.2s;
    }
    .sticker-card.unlocked {
      box-shadow: 0 8px 32px #ffe08244, 0 2px 18px #b3e5fc66;
      animation: popSticker 0.85s cubic-bezier(.18,2.2,.21,.89);
    }
    .sticker-card.locked {
      filter: grayscale(1) blur(1.5px) brightness(0.87);
      opacity: 0.6;
    }
    .sticker-card img {
      width: 56px;
      margin: 16px 0 8px 0;
      filter: drop-shadow(0 2px 8px #ffe082b2);
      user-select: none;
      pointer-events: none;
    }
    .sticker-title {
      font-size: 1.08rem;
      color: #fbc02d;
      font-family: 'Comic Neue', Arial, sans-serif;
      text-align: center;
      margin-top: 0;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px #fff9c4;
      user-select: none;
      pointer-events: none;
    }
    @keyframes popSticker {
      0% { transform: scale(0.6) rotate(-12deg); opacity:0; }
      60% { transform: scale(1.15) rotate(3deg); opacity:1;}
      100% { transform: scale(1) rotate(0); opacity:1;}
    }
    .back-link {
      display: block;
      text-align: center;
      margin: 38px auto 0 auto;
      font-size: 1.15rem;
      color: #2196f3;
      background: #e3f2fd44;
      border-radius: 14px;
      width: fit-content;
      padding: 10px 26px;
      box-shadow: 0 2px 8px #b3e5fc44;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.17s, color 0.17s;
    }
    .back-link:hover {
      color: #1565c0;
      background: #fffde7;
    }
    @media (max-width: 600px) {
      .sticker-board-container { padding: 12px 2vw 22px 2vw; }
      .sticker-board { gap: 17px 9px; }
      .sticker-card { width: 62px; height: 74px; padding-bottom: 9px; }
      .sticker-card img { width: 31px; }
      .sticker-title { font-size: 0.92rem;}
      .back-link { font-size: 0.98rem; padding: 7px 16px; }
    }
  </style>
</head>
<body>
  <div class="sticker-board-container">
    <h1>🏅 Sticker Board</h1>
    <div class="sticker-board" id="stickerBoard"></div>
  </div>
  <a href="/choose" class="back-link" style="
  font-size:1.24rem;
  background: linear-gradient(90deg,#ffe082 65%,#81d4fa 100%);
  color:#383838;
  border-radius:24px;
  padding: 15px 40px 15px 24px;
  font-family: 'Comic Neue', 'Baloo 2', Arial, sans-serif;
  box-shadow: 0 4px 16px #b3e5fc55;
  text-decoration:none;
  margin-top:36px;
  display:inline-flex;
  align-items:center;
  gap:12px;
  font-weight:bold;
  letter-spacing:0.01em;
  transition:background 0.22s, color 0.14s, transform 0.11s;
"
  onmouseover="this.style.background='#fffde7';this.style.color='#1565c0';this.style.transform='scale(1.06)'"
  onmouseout="this.style.background='linear-gradient(90deg,#ffe082 65%,#81d4fa 100%)';this.style.color='#383838';this.style.transform='scale(1)'"
>
  <span style="font-size:1.6em;line-height:1;">🏠</span>
  <span>Back to Choose</span>
</a>

  <script>
    // Sticker-Array (Bilder und Namen!)
    const stickerImages = [
      "images/stickers/sticker-star.png",
      "images/stickers/sticker-party.png",
      "images/stickers/sticker-butterfly.png",
      "images/stickers/sticker-trophy.png",
      "images/stickers/sticker-medal.png"
    ];
    const stickerNames = [
      "Superstar",
      "Party Time",
      "Beautiful Butterfly",
      "Champion Trophy",
      "Winner Medal"
    ];
    // Freigeschaltete Sticker aus LocalStorage laden
    const unlocked = JSON.parse(localStorage.getItem('unlockedStickers') || "[]");

    const board = document.getElementById('stickerBoard');
    stickerImages.forEach((src, idx) => {
      const card = document.createElement('div');
      card.className = "sticker-card " + (unlocked.includes(idx) ? "unlocked" : "locked");
      card.innerHTML = `<img src="${src}" alt="Sticker"><div class="sticker-title">${stickerNames[idx]}</div>`;
      board.appendChild(card);
    });
  </script>
</body>
</html>
