<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">Coach Max – Day</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lottie-web/build/player/lottie.min.js"></script>
</head>
<body>
  <div id="welcomeArea"></div>
  <div id="mainContent" style="display:none;">
    <h2 id="mainTitle" class="session-heading"></h2>
    <div class="session-text-area" id="sessionTextArea"></div>
    <div id="progressFrogBar">
      <div class="frog-bar-track">
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <img src="images/frog.png" id="jumpingFrog" />
      </div>
    </div>
  </div>
  <div id="rotationNotice" class="rotation-notice" style="display:none;">
    <div>
      <img src="images/rotate-phone.png" class="rotate-icon" alt="Rotate"/>
      <p>Please rotate your device to portrait mode to continue. 😊</p>
    </div>
  </div>
  <audio id="frogSound" src="audio/frog-hop.mp3" preload="auto"></audio>
  <audio id="welcomeMusic" src="audio/welcome-music.mp3" preload="auto" loop></audio>
  <audio id="breathingMusic" src="audio/focus-loop.mp3" preload="auto" loop></audio>

  <script type="module">
  import { DEV_MODE } from "/js/config.js";
  import { auth, db, onAuthStateChanged, doc, getDoc, updateDoc, arrayUnion } from "/js/firebase.js";

  const urlParams = new URLSearchParams(window.location.search);
  const currentDay = DEV_MODE ? 1 : parseInt(urlParams.get("day")) || 1;
  const activeChildId = localStorage.getItem("activeChildId");
  const mainTitle = document.getElementById("mainTitle");
  const pageTitle = document.getElementById("pageTitle");
  let user = null;

  pageTitle.textContent = `Coach Max – Day ${currentDay}`;
  mainTitle.textContent = `Welcome to Coach Max – Day ${currentDay}`;

  // === Login/Trial nur im Live-Modus ===
  if (!DEV_MODE) {
    onAuthStateChanged(auth, async (u) => {
      if (!u) return window.location.href = "index.html";
      user = u;
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (!userDoc.exists()) return window.location.href = "index.html";

      const subData = userDoc.data();
      const trialExpired =
        subData.subscriptionStatus !== "premium" &&
        Date.now() > subData.trialEnds;

      if (trialExpired && currentDay > 7) {
        alert("Your trial has ended. Please upgrade to Premium to continue!");
        window.location.href = "choose.html";
      }
    });
  }

  // === Speichern nur im Live-Modus ===
  async function markDayCompleted() {
    if (DEV_MODE) return;
    const childRef = doc(db, "users", user.uid, "children", activeChildId);
    await updateDoc(childRef, { completedDays: arrayUnion(currentDay) });
  }

  async function saveRewards(stickers = [], puzzlePieces = []) {
    if (DEV_MODE) return;
    const childRef = doc(db, "users", user.uid, "children", activeChildId);
    const childSnap = await getDoc(childRef);
    const data = childSnap.data();
    const updatedStickers = Array.from(new Set([...(data.stickers || []), ...stickers]));
    const updatedPuzzle = Array.from(new Set([...(data.puzzlePieces || []), ...puzzlePieces]));
    await updateDoc(childRef, { stickers: updatedStickers, puzzlePieces: updatedPuzzle });
  }

  // === Fertigstellen (Im DEV nur Test-Alert, im Live mit Speichern & Weiterleitung) ===
  window.finishDay = async (stickers = [], puzzlePieces = []) => {
    if (!DEV_MODE) {
      await markDayCompleted();
      await saveRewards(stickers, puzzlePieces);
      window.location.href = "choose.html";
    } else {
      alert("Day completed! (Test Mode – no data saved)");
    }
  };
</script>

  <script src="js/app.js" defer></script>
</body>
</html>
