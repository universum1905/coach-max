<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">Coach Max – Day</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lottie-web/build/player/lottie.min.js"></script>
</head>
<body>
  <div id="welcomeArea"></div>
  <div id="mainContent" style="display:none;">
    <h2 id="mainTitle" class="session-heading"></h2>
    <div class="session-text-area" id="sessionTextArea"></div>
    <div id="progressFrogBar">
      <div class="frog-bar-track">
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <div class="frog-bar-spot"></div>
        <img src="images/frog.png" id="jumpingFrog" />
      </div>
    </div>
  </div>
  <div id="rotationNotice" class="rotation-notice" style="display:none;">
    <div>
      <img src="images/rotate-phone.png" class="rotate-icon" alt="Rotate"/>
      <p>Please rotate your device to portrait mode to continue. 😊</p>
    </div>
  </div>
  <audio id="frogSound" src="audio/frog-hop.mp3" preload="auto"></audio>
  <audio id="welcomeMusic" src="audio/welcome-music.mp3" preload="auto" loop></audio>
  <audio id="breathingMusic" src="audio/focus-loop.mp3" preload="auto" loop></audio>

  <script type="module">
import { DEV_MODE } from "./js/config.js";
import { auth, db } from "./js/firebase.js";
import { doc, updateDoc, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

let currentUser = null;
let activeChildId = localStorage.getItem("activeChildId");

onAuthStateChanged(auth, async (user) => {
  if (!user && !DEV_MODE) {
    window.location.href = "index.html";
  } else {
    currentUser = user;
  }
});

// === Tag als abgeschlossen markieren ===
async function markDayCompleted(day) {
  if (DEV_MODE) return;
  if (!currentUser || !activeChildId) return;
  const childRef = doc(db, "users", currentUser.uid, "children", activeChildId);
  await updateDoc(childRef, { completedDays: arrayUnion(day) });
}

// === Sticker & Puzzle speichern ===
async function saveRewards(day, stickers = [], puzzlePieces = []) {
  if (DEV_MODE) return;
  if (!currentUser || !activeChildId) return;
  const childRef = doc(db, "users", currentUser.uid, "children", activeChildId);
  const snap = await getDoc(childRef);
  const data = snap.data();
  const updatedStickers = Array.from(new Set([...(data.stickers || []), ...stickers]));
  const updatedPuzzle = Array.from(new Set([...(data.puzzlePieces || []), ...puzzlePieces]));
  await updateDoc(childRef, { stickers: updatedStickers, puzzlePieces: updatedPuzzle });
}

// === Tag beenden ===
window.finishDay = async (stickers = [], puzzlePieces = []) => {
  const urlParams = new URLSearchParams(window.location.search);
  const currentDay = parseInt(urlParams.get("day")) || 1;

  if (!DEV_MODE) {
    await markDayCompleted(currentDay);
    await saveRewards(currentDay, stickers, puzzlePieces);
  } else {
    console.log("DEV_MODE: Finish simulated", { currentDay, stickers, puzzlePieces });
  }

  setTimeout(() => {
    window.location.href = "choose.html";
  }, 800);
};
</script>

  
</body>
</html>
