<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(120deg, #e0f7fa 0%, #ffe082 100%);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5em;
    }
    p {
      font-size: 1.3rem;
      margin-bottom: 1em;
    }
    a {
      display: inline-block;
      background: #ff6f61;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.1rem;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }
    a:hover {
      background: #3498db;
    }
    a:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <h1>404 – Page Not Found</h1>
  <p>Oops! The page you are looking for doesn’t exist.</p>
  <a href="/">Back to Home</a>
</body>
</html>
