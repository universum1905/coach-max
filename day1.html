<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach Max – Day 1 Intro</title>

  <!-- Google Font: Baloo 2 -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Baloo 2', cursive;
      background: url('images/backgrounds/2.png') no-repeat center center fixed;
      background-size: cover;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
      box-sizing: border-box;
    }

    .text-line {
      font-size: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 25px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      max-width: 100%;
      opacity: 0;
      transform: translateX(-50px);
      position: relative;
      overflow: hidden;
    }

    .text-line.show {
      animation: slideIn 0.8s ease forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Glitzer-Effekt */
    .text-line.show::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: shine 2s ease-out forwards;
    }

    @keyframes shine {
      0% { background-position: -200%; }
      100% { background-position: 200%; }
    }

    /* Pulsieren nur bei letzter Zeile */
    #line6.show {
      animation: slideIn 0.8s ease forwards, pulse 2s infinite ease-in-out;
      background-color: #fff0d6;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0px rgba(255, 200, 100, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 15px rgba(255, 180, 0, 0.6); }
      100% { transform: scale(1); box-shadow: 0 0 0px rgba(255, 200, 100, 0.4); }
    }

    .video-wrapper {
      height: 0;
    }

    .video-box {
      width: 250px;
      max-width: 30vw;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    .video-fixed {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
    }

    .video-static {
      position: relative;
      margin: 3rem auto 4rem auto;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }

    /* Responsiv-Optimierung */
    @media (max-width: 768px) {
      .page-container {
        padding-right: 1rem;
        padding-left: 1rem;
      }

      .text-line {
        font-size: 2rem;
      }

      .video-box {
        width: 260px;
        max-width: 80vw;
      }
    }
  </style>
</head>
<body>

  <div class="page-container" id="main">
    <!-- Intro-Texte -->
    <div class="text-line" id="line1">Hi there!</div>
    <div class="text-line" id="line2">Are you ready for today’s adventure?</div>
    <div class="text-line" id="line3">We’re going to breathe, count, rhyme...</div>
    <div class="text-line" id="line5">Meet an animal and hear a little story!</div>
    <div class="text-line" id="line6">✨ Let’s get started! ✨</div>

    <!-- Trigger -->
    <div class="video-wrapper" id="video-trigger"></div>

    <!-- Video -->
    <div class="video-box video-fixed" id="videoBox">
      <video id="introVideo" src="videos/day1-intro.mp4" controls playsinline></video>
    </div>
  </div>

  <script>
    const videoBox = document.getElementById("videoBox");
    const trigger = document.getElementById("video-trigger");
    const video = document.getElementById("introVideo");

    // Fixiert → mitlaufend
    window.addEventListener("scroll", () => {
      const triggerPosition = trigger.getBoundingClientRect().top;
      if (triggerPosition < 100) {
        videoBox.classList.remove("video-fixed");
        videoBox.classList.add("video-static");
      } else {
        videoBox.classList.remove("video-static");
        videoBox.classList.add("video-fixed");
      }
    });

    // Text-Einblendung + Scroll
    const lines = [
      document.getElementById("line1"),
      document.getElementById("line2"),
      document.getElementById("line3"),
      document.getElementById("line5"),
      document.getElementById("line6"),
    ];

    const timings = [1120, 2220, 6000, 10020, 14000]; // in ms

    video.addEventListener("play", () => {
      lines.forEach((line, index) => {
        setTimeout(() => {
          line.classList.add("show");
          line.scrollIntoView({ behavior: "smooth", block: "center" });
        }, timings[index]);
      });
    });
  </script>

</body>
</html>
