<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach Max – Day 1 Intro</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Baloo 2', cursive;
      background: url('images/backgrounds/2.png') no-repeat center center fixed;
      background-size: cover;
      scroll-behavior: smooth;
      overflow-x: hidden; /* ✅ Kein horizontaler Scroll */
    }

    .page-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }

    .text-line {
      font-size: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 25px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      max-width: calc(100% - 180px); /* Platz für Video rechts */
      opacity: 0;
      transform: translateX(-50px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .text-line.show {
      animation: slideIn 0.8s ease forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ✨ Sichtbarer Glitzereffekt */
    .text-line.show::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.9),
        transparent
      );
      background-size: 200% 100%;
      animation: shine 2.2s linear;
      z-index: 0;
    }

    @keyframes shine {
      from { background-position: -200% 0; }
      to   { background-position: 200% 0; }
    }

    /* 🌟 Pulsieren bei letzter Zeile */
    #line6.show {
      animation: slideIn 0.8s ease forwards, pulse 1.5s infinite ease-in-out;
      background-color: #fff0d6;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 200, 100, 0.4); }
      50% { transform: scale(1.07); box-shadow: 0 0 25px rgba(255, 180, 0, 0.6); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 200, 100, 0.4); }
    }

    .video-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 150px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      z-index: 999;
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 20px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="page-container" id="main">
    <div class="text-line" id="line1">Hi there!</div>
    <div class="text-line" id="line2">Are you ready for today’s adventure?</div>
    <div class="text-line" id="line3">We’re going to breathe, count, rhyme...</div>
    <div class="text-line" id="line5">Meet an animal and hear a little story!</div>
    <div class="text-line" id="line6">✨ Let’s get started! ✨</div>
  </div>

  <div class="video-box">
    <video id="introVideo" src="videos/day1-intro.mp4" controls playsinline></video>
  </div>

  <script>
    const video = document.getElementById("introVideo");

    const lines = [
      document.getElementById("line1"),
      document.getElementById("line2"),
      document.getElementById("line3"),
      document.getElementById("line5"),
      document.getElementById("line6"),
    ];

    const timings = [1120, 2220, 6000, 10020, 18200]; // ms

    video.addEventListener("play", () => {
      lines.forEach((line, index) => {
        setTimeout(() => {
          line.classList.add("show");
          line.scrollIntoView({ behavior: "smooth", block: "center" });
        }, timings[index]);
      });
    });
  </script>

</body>
</html>
