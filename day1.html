<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Coach Max – Day {{DAY}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.3.0/dist/dotlottie-wc.js" type="module"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: url('images/backgrounds/2.png') repeat;
      background-size: cover;
    }
    .animate-wiggle {
      animation: wiggle 1.5s infinite ease-in-out;
      display: inline-block;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(5deg); }
    }
    @media screen and (orientation: portrait) {
      #orientationOverlay { display: flex; }
      #mainContent { display: none; }
    }
    @media screen and (orientation: landscape) {
      #orientationOverlay { display: none; }
      #mainContent { display: block; }
    }
  </style>
</head>
<body class="text-black flex flex-col items-center justify-start min-h-screen p-4 overflow-y-auto">
  <div id="orientationOverlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center text-center p-6 bg-yellow-100 text-black">
    <img src="images/landscape-mode-child-cartoon.png" alt="Rotate" class="w-40 h-auto mb-4 rounded-xl shadow-md" />
    <div class="text-6xl mb-4 animate-wiggle">🔄</div>
    <p class="text-2xl font-bold mb-2">Please rotate your device</p>
    <p class="text-lg">So you can enjoy the activity in full screen 😊</p>
  </div>

  <audio id="successSound" src="audio/success.mp3" preload="auto"></audio>

  <div id="mainContent" class="w-full max-w-xl space-y-6">
    <!-- Session 1: Counting with Animals -->
    <div id="session1" class="bg-white bg-opacity-80 rounded-xl p-4 shadow text-center">
      <h2 class="text-3xl font-bold mb-4">🔢 Let’s Count with Animals!</h2>
      <p class="text-lg mb-4">Say the numbers out loud and meet a new animal with each one!</p>
      <div id="counting-area" class="flex flex-wrap justify-center gap-4"></div>
      <button onclick="showFinish()" class="mt-6 bg-green-500 text-white px-6 py-2 rounded-full">🎉 Finish Day {{DAY}}</button>
    </div>
  </div>

  <script>
    const DAY_NUMBER = {{DAY}};

    const animals = [
      { number: 1, name: "Dog", img: "images/animals/1-dog.png" },
      { number: 2, name: "Cat", img: "images/animals/2-cat.png" },
      { number: 3, name: "Elephant", img: "images/animals/3-elephant.png" },
      { number: 4, name: "Frog", img: "images/animals/4-frog.png" },
      { number: 5, name: "Lion", img: "images/animals/5-lion.png" },
      { number: 6, name: "Monkey", img: "images/animals/6-monkey.png" },
      { number: 7, name: "Rabbit", img: "images/animals/7-rabbit.png" },
      { number: 8, name: "Penguin", img: "images/animals/8-penguin.png" },
      { number: 9, name: "Tiger", img: "images/animals/9-tiger.png" },
      { number: 10, name: "Bear", img: "images/animals/10-bear.png" },
    ];

    const container = document.getElementById("counting-area");

    animals.forEach((item, i) => {
      setTimeout(() => {
        const bubble = document.createElement("div");
        bubble.className = "bg-yellow-300 text-2xl font-bold text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg";
        bubble.textContent = item.number;

        const img = document.createElement("img");
        img.src = item.img;
        img.alt = item.name;
        img.className = "w-24 h-24 object-contain";

        const wrapper = document.createElement("div");
        wrapper.className = "flex flex-col items-center gap-2";
        wrapper.appendChild(bubble);
        wrapper.appendChild(img);

        container.appendChild(wrapper);
      }, i * 800);
    });

    function showFinish() {
      document.querySelectorAll('[id^="session"], #intro').forEach(el => el.classList.add('hidden'));
      const finishScreen = document.createElement("div");
      finishScreen.className = "text-center space-y-4 mt-10";
      finishScreen.innerHTML = `
        <h2 class="text-3xl font-bold text-green-700">✅ Great job today!</h2>
        <lottie-player
          src="animation/hai-animation.json"
          background="transparent"
          speed="1"
          style="width: 160px; height: 160px; margin: auto;"
          autoplay loop></lottie-player>
        <p class="text-xl">Come back tomorrow at 6:00 AM to unlock Day 2 🌞</p>
        <div class="flex justify-center gap-4">
          <a href="stickers.html" class="bg-yellow-500 text-black px-4 py-2 rounded-full">🏅 See Stickers</a>
          <a href="index.html" class="bg-gray-700 text-white px-4 py-2 rounded-full">🏠 Back Home</a>
          <button onclick="goToNextDay()" class="bg-blue-600 text-white px-6 py-2 rounded-full">➡️ Continue to Day 2</button>
        </div>`;
      document.getElementById("mainContent").appendChild(finishScreen);
      sessionStorage.setItem('showSuccess', 'true');
      localStorage.setItem(`day${DAY_NUMBER}Completed`, 'true');
      const now = new Date();
      const unlock = new Date(now);
      unlock.setDate(unlock.getDate() + 1);
      unlock.setHours(6, 0, 0, 0);
      localStorage.setItem(`day${DAY_NUMBER + 1}UnlockTime`, unlock.getTime());
      sessionStorage.setItem('dayUnlockedMessage', 'true');
      sessionStorage.setItem('stickerUnlocked', 'true');
      const sound = document.getElementById("successSound");
      if (sound) { sound.volume = 0.5; sound.play().catch(() => {}); }
      showStickerPopup();
    }

    function goToNextDay() {
      sessionStorage.setItem('dayUnlockedMessage', 'true');
      window.location.href = 'choose.html';
    }

    function showStickerPopup() {
      const popup = document.createElement('div');
      popup.textContent = '🏅 Sticker Unlocked!';
      popup.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-black px-4 py-2 rounded-xl shadow-lg z-50';
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 3000);
    }

    window.showSession = showSession;
    window.showFinish = showFinish;
    window.goToNextDay = goToNextDay;
  </script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</body>
</html>
