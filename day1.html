<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Coach Max – Day {{DAY}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.3.0/dist/dotlottie-wc.js" type="module"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: url('images/backgrounds/2.png') repeat;
      background-size: cover;
    }
    .animate-wiggle {
      animation: wiggle 1.5s infinite ease-in-out;
      display: inline-block;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(5deg); }
    }
    @media screen and (orientation: portrait) {
      #orientationOverlay { display: flex; }
      #mainContent { display: none; }
    }
    @media screen and (orientation: landscape) {
      #orientationOverlay { display: none; }
      #mainContent { display: block; }
    }
  </style>
</head>
<body class="text-black flex flex-col items-center justify-start min-h-screen p-4 overflow-y-auto">
  <div id="orientationOverlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center text-center p-6 bg-yellow-100 text-black">
    <img src="images/landscape-mode-child-cartoon.png" alt="Rotate" class="w-40 h-auto mb-4 rounded-xl shadow-md" />
    <div class="text-6xl mb-4 animate-wiggle">🔄</div>
    <p class="text-2xl font-bold mb-2">Please rotate your device</p>
    <p class="text-lg">So you can enjoy the activity in full screen 😊</p>
  </div>

  <audio id="successSound" src="audio/success.mp3" preload="auto"></audio>

  <div id="mainContent" class="w-full max-w-xl space-y-6">
    <!-- Session 1: Counting with Animals -->
    <div id="session1" class="bg-white bg-opacity-80 rounded-xl p-4 shadow text-center">
      <h2 class="text-3xl font-bold mb-4">🔢 Let’s Count with Animals!</h2>
      <p class="text-lg mb-4">Say the numbers out loud and meet a new animal with each one!</p>
      <div id="counting-area" class="flex flex-wrap justify-center gap-4"></div>
      <div class="flex justify-center mt-6">
        <button onclick="showSession(2)" class="bg-blue-500 text-white px-6 py-2 rounded-full">Next ➡️</button>
      </div>
    </div>
    
    <!-- Session 2 Placeholder -->
    <div id="session2" class="hidden bg-white bg-opacity-80 rounded-xl p-4 shadow text-center">
      <h2 class="text-3xl font-bold mb-4">📖 Next Session Title Here</h2>
      <p class="text-lg">More content will follow here...</p>
    </div>
  </div>

  <script>
    const DAY_NUMBER = {{DAY}};

    const animals = [
      { number: 1, name: "Dog", img: "images/animals/1-dog.png" },
      { number: 2, name: "Cat", img: "images/animals/2-cat.png" },
      { number: 3, name: "Mouse", img: "images/animals/3-mouse.png" },
      { number: 4, name: "Rabbit", img: "images/animals/4-rabbit.png" },
      { number: 5, name: "Lion", img: "images/animals/5-lion.png" },
      { number: 6, name: "Cow", img: "images/animals/6-cow.png" },
      { number: 7, name: "Frog", img: "images/animals/7-frog.png" },
      { number: 8, name: "Monkey", img: "images/animals/8-monkey.png" },
      { number: 9, name: "Penguin", img: "images/animals/9-penguin.png" },
      { number: 10, name: "Elephant", img: "images/animals/10-elephant.png" }
    ];

    const container = document.getElementById("counting-area");

    function showAnimalsSequentially(index = 0) {
      if (index >= animals.length) return;
      const item = animals[index];
      const bubble = document.createElement("div");
      bubble.className = "bg-yellow-300 text-2xl font-bold text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg";
      bubble.textContent = item.number;

      const img = document.createElement("img");
      img.src = item.img;
      img.alt = item.name;
      img.className = "w-24 h-24 object-contain";

      const wrapper = document.createElement("div");
      wrapper.className = "flex flex-col items-center gap-2";
      wrapper.appendChild(bubble);
      wrapper.appendChild(img);

      container.appendChild(wrapper);

      setTimeout(() => showAnimalsSequentially(index + 1), 1000);
    }

    function showSession(num) {
      document.querySelectorAll('[id^="session"]').forEach(el => el.classList.add('hidden'));
      const session = document.getElementById(`session${num}`);
      if (session) session.classList.remove('hidden');
    }

    function showStickerPopup() {
      const popup = document.createElement('div');
      popup.textContent = '🏅 Sticker Unlocked!';
      popup.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-black px-4 py-2 rounded-xl shadow-lg z-50';
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 3000);
    }

    window.onload = () => {
      showAnimalsSequentially();
      showSession(1);
    };
  </script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</body>
</html>
