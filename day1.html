<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach Max – Day 1 Intro</title>

  <!-- Google Font: Baloo 2 -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Baloo 2', cursive;
      background: url('images/backgrounds/2.png') no-repeat center center fixed;
      background-size: cover;
      scroll-behavior: smooth;
    }

    .page-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
      padding-right: 350px;
    }

    .text-line {
      font-size: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 25px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      max-width: 90%;
      opacity: 0;
      transform: translateX(-50px);
    }

    /* Sichtbar machen mit Animation */
    .text-line.show {
      animation: slideIn 0.6s ease forwards;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .video-wrapper {
      height: 0;
    }

    .video-box {
      width: 300px;
      max-width: 90vw;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    .video-fixed {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
    }

    .video-static {
      position: relative;
      margin: 3rem auto 4rem auto;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="page-container" id="main">
    <!-- Deine 5 Textzeilen -->
    <div class="text-line" id="line1">Hi there!</div>
    <div class="text-line" id="line2">Are you ready for today’s adventure?</div>
    <div class="text-line" id="line3">We’re going to breathe, count, rhyme...</div>
    <div class="text-line" id="line5">Meet an animal and hear a little story!</div>
    <div class="text-line" id="line6">Let’s get started!</div>

    <!-- Scroll-Trigger -->
    <div class="video-wrapper" id="video-trigger"></div>

    <!-- Video -->
    <div class="video-box video-fixed" id="videoBox">
      <video id="introVideo" src="videos/day1-intro.mp4" controls playsinline></video>
    </div>
  </div>

  <script>
    const videoBox = document.getElementById("videoBox");
    const trigger = document.getElementById("video-trigger");
    const video = document.getElementById("introVideo");

    // Position-Übergang fixiert → normal scrollend
    window.addEventListener("scroll", () => {
      const triggerPosition = trigger.getBoundingClientRect().top;
      if (triggerPosition < 100) {
        videoBox.classList.remove("video-fixed");
        videoBox.classList.add("video-static");
      } else {
        videoBox.classList.remove("video-static");
        videoBox.classList.add("video-fixed");
      }
    });

    // Texte + Scroll erscheinen synchron zum Video
    const lines = [
      document.getElementById("line1"),
      document.getElementById("line2"),
      document.getElementById("line3"),
      document.getElementById("line5"),
      document.getElementById("line6"),
    ];

    const timings = [1120, 2220, 6000, 10020, 18200]; // ms

    video.addEventListener("play", () => {
      lines.forEach((line, index) => {
        setTimeout(() => {
          line.classList.add("show");
          line.scrollIntoView({ behavior: "smooth", block: "center" });
        }, timings[index]);
      });
    });
  </script>

</body>
</html>
