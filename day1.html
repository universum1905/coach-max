<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Coach Max – Day 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(to bottom right, #b2f5ea, #f0fff4);
    }
    .animate-wiggle {
      animation: wiggle 1.5s infinite ease-in-out;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(5deg); }
    }
  </style>
</head>
<body class="text-black flex flex-col items-center justify-start min-h-screen p-4 overflow-y-auto">

  <!-- Audio: Erfolgssound -->
  <audio id="successSound" src="audio/success.mp3" preload="auto"></audio>

  <!-- Main Content -->
  <div id="mainContent" class="w-full max-w-xl space-y-6">

    <!-- Day Intro -->
    <div id="intro">
      <h2 class="text-3xl font-bold text-center mb-2">👋 Welcome to Day 1!</h2>
      <video class="w-full max-h-[240px] rounded-lg shadow" controls playsinline>
        <source src="videos/day1-intro.mp4" type="video/mp4" />
      </video>
      <div class="flex justify-center mt-4">
        <button onclick="showSession(1)" class="bg-blue-500 text-white px-6 py-2 rounded-full">Start</button>
      </div>
    </div>

    <!-- Session 1 -->
    <div id="session1" class="hidden">
      <h2 class="text-2xl font-bold text-center mb-2">🧘 Let’s begin with a breathing game!</h2>
      <video class="w-full max-h-[240px] rounded-lg shadow" controls playsinline>
        <source src="videos/day1-breath.mp4" type="video/mp4" />
      </video>
      <div class="flex justify-center mt-4">
        <button onclick="showSession(2)" class="bg-blue-500 text-white px-6 py-2 rounded-full">Next</button>
      </div>
    </div>

    <!-- Session 2 -->
    <div id="session2" class="hidden">
      <h2 class="text-2xl font-bold text-center mb-2">➕ Can you count with Benny?</h2>
      <video class="w-full max-h-[240px] rounded-lg shadow" controls playsinline>
        <source src="videos/day1-counting1-10.mp4" type="video/mp4" />
      </video>
      <div class="flex justify-center gap-4 mt-4">
        <button onclick="showSession(1)" class="bg-gray-400 text-white px-6 py-2 rounded-full">Back</button>
        <button onclick="showSession(3)" class="bg-blue-500 text-white px-6 py-2 rounded-full">Next</button>
      </div>
    </div>

    <!-- Session 3 -->
    <div id="session3" class="hidden">
      <h2 class="text-2xl font-bold text-center mb-2">🎵 Find the rhyme!</h2>
      <video class="w-full max-h-[240px] rounded-lg shadow" controls playsinline>
        <source src="videos/day1-rhyme.mp4" type="video/mp4" />
      </video>
      <div class="flex justify-center gap-4 mt-4">
        <button onclick="showSession(2)" class="bg-gray-400 text-white px-6 py-2 rounded-full">Back</button>
        <button onclick="showSession(4)" class="bg-blue-500 text-white px-6 py-2 rounded-full">Next</button>
      </div>
    </div>

    <!-- Session 4 -->
    <div id="session4" class="hidden">
      <h2 class="text-2xl font-bold text-center mb-2">🐾 What animal is this?</h2>
      <video class="w-full max-h-[240px] rounded-lg shadow" controls playsinline>
        <source src="videos/day1-animals.mp4" type="video/mp4" />
      </video>
      <div class="flex justify-center gap-4 mt-4">
        <button onclick="showSession(3)" class="bg-gray-400 text-white px-6 py-2 rounded-full">Back</button>
        <button onclick="showSession(5)" class="bg-blue-500 text-white px-6 py-2 rounded-full">Bonus Story</button>
      </div>
    </div>

    <!-- Session 5 -->
    <div id="session5" class="hidden">
      <h2 class="text-2xl font-bold text-center mb-2">📖 Story Time with Luna</h2>
      <video class="w-full max-h-[240px] rounded-lg shadow" controls playsinline>
        <source src="videos/day1-story.mp4" type="video/mp4" />
      </video>
      <div class="flex justify-center gap-4 mt-4">
        <button onclick="showSession(4)" class="bg-gray-400 text-white px-6 py-2 rounded-full">Back</button>
        <button onclick="showFinish()" class="bg-green-600 text-white px-6 py-2 rounded-full">Finish Day 1</button>
      </div>
    </div>

    <!-- Abschluss -->
    <div id="finish-screen" class="hidden text-center space-y-4">
      <h2 class="text-3xl font-bold text-green-700">✅ Great job today!</h2>
      <lottie-player
        src="https://assets5.lottiefiles.com/packages/lf20_u4yrau.json"
        background="transparent"
        speed="1"
        style="width: 160px; height: 160px; margin: auto;"
        autoplay
      ></lottie-player>
      <p class="text-xl">Come back tomorrow at 6:00 AM to unlock Day 2 🌞</p>
      <div class="flex justify-center gap-4">
        <a href="stickers.html" class="bg-yellow-500 text-black px-4 py-2 rounded-full">🏅 See Stickers</a>
        <a href="index.html" class="bg-gray-700 text-white px-4 py-2 rounded-full">🏠 Back Home</a>
      </div>
    </div>
  </div>

  <script>
    const DAY_NUMBER = 1;

    function showSession(num) {
      document.querySelectorAll('[id^="session"], #intro, #finish-screen').forEach(el => el.classList.add('hidden'));
      document.getElementById(`session${num}`).classList.remove('hidden');
    }

    function showFinish() {
      document.querySelectorAll('[id^="session"], #intro').forEach(el => el.classList.add('hidden'));
      document.getElementById('finish-screen').classList.remove('hidden');
      sessionStorage.setItem('showSuccess', 'true');
      window.location.href = 'choose.html';

      // Fortschritt speichern
      localStorage.setItem(`day${DAY_NUMBER}Completed`, 'true');

      // Unlock-Time für nächsten Tag (06:00 Uhr lokal)
      const now = new Date();
      const unlock = new Date(now);
      unlock.setDate(unlock.getDate() + 1);
      unlock.setHours(6, 0, 0, 0);
      localStorage.setItem(`day${DAY_NUMBER + 1}UnlockTime`, unlock.getTime());

      // Soundeffekt abspielen
      const sound = document.getElementById("successSound");
      if (sound) {
        sound.volume = 0.5;
        sound.play().catch(() => {});
      }
    }
  </script>
</body>
</html>
