<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach Max – Day 1 Intro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: url('images/backgrounds/2.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
    }

    .container {
      padding: 2rem;
      max-width: 800px;
    }

    .text-line {
      font-size: 2rem;
      background: rgba(255, 255, 255, 0.8);
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 1rem;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateX(-50px);
      animation: slideIn 0.6s ease forwards;
    }

    .text-line:nth-child(1) { animation-delay: 0.5s; }
    .text-line:nth-child(2) { animation-delay: 1.5s; }
    .text-line:nth-child(3) { animation-delay: 2.5s; }
    .text-line:nth-child(4) { animation-delay: 3.5s; }
    .text-line:nth-child(5) { animation-delay: 4.5s; }
    .text-line:nth-child(6) { animation-delay: 5.5s; }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .video-box {
      position: relative;
      margin-top: 2rem;
      display: flex;
      justify-content: flex-end;
      padding-right: 2rem;
    }

    video {
      width: 320px;
      height: auto;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="text-line">Hi there!</div>
    <div class="text-line">Are you ready for today’s adventure?</div>
    <div class="text-line">We’re going to breathe,</div>
    <div class="text-line">count, rhyme...</div>
    <div class="text-line">Meet an animal</div>
    <div class="text-line">and hear a little story! Let’s get started!</div>

    <div class="video-box">
      <video src="videos/day1-intro.mp4" autoplay muted playsinline></video>
    </div>
  </div>

</body>
</html>
